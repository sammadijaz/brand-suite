name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix skills/brand-suite ci --ignore-scripts
      - run: npm run fixtures
      - run: npm run check && npm test
      - run: npm audit --omit=dev --prefix skills/brand-suite
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DISABLE_TELEMETRY: '1'
      BRAND_SUITE_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu-core
      - run: npm ci --ignore-scripts && npm --prefix skills/brand-suite ci --ignore-scripts
      - run: python -m pip install -r skills/brand-suite/requirements.txt
      - run: python scripts/security-office.py
      - run: node skills/brand-suite/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run fixtures && npm run integration
      - run: node -e "const r=require('./.work/integration-results.json');require('child_process').execFileSync(process.execPath,['scripts/adversarial.mjs',r.suites[0].output],{stdio:'inherit'})"
      - run: node scripts/mode-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-render-results
          path: |
            .work/integration-results.json
            .work/adversarial-results.json
            .work/mode-results.json
            .work/security-office-results.json
          retention-days: 7
